[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jarvis-agent"
version = "1.0.0"
description = "A small, hackable personal assistant with tool calling, memory, CLI and web UIs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
jarvis = "jarvis.cli:main"

[project.urls]
Repository = "https://github.com/Ghanshyam015/Jarvis"

[tool.setuptools]
packages = ["jarvis"]

[tool.setuptools.package-data]
jarvis = ["web/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
